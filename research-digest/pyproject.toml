[project]
name = "research-digest"
version = "0.1.0"
description = "Scheduled AI research summarizer: arXiv + lab blogs -> LLM summaries -> Discord, web, and a daily digest."
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["research_digest*"]

[tool.setuptools.package-data]
research_digest = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
